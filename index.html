<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Small Business Hisab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--paper:#fff;--ink:#14213D;--mute:#56626B;--line:#D5DEDB;--brand:#2B2F77;--onbrand:#fff;--green:#0F7B6C;--red:#B3261E;--amber:#A15C00;--rule:#CFE0F0;--margin:#E7A5A0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1417;--paper:#172026;--ink:#E8EEF0;--mute:#9AA9B0;--line:#2A373E;--brand:#A9AEFF;--onbrand:#12143A;--green:#4FD1B8;--red:#FF8A80;--amber:#F0B35A;--rule:#24323A;--margin:#5A3A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1417;--paper:#172026;--ink:#E8EEF0;--mute:#9AA9B0;--line:#2A373E;--brand:#A9AEFF;--onbrand:#12143A;--green:#4FD1B8;--red:#FF8A80;--amber:#F0B35A;--rule:#24323A;--margin:#5A3A3A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Mukta,system-ui,sans-serif;padding-bottom:84px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
h1,h2,h3{font-weight:800;line-height:1.2;margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{font-weight:800;font-size:18px;background:none;border:0;padding:0;cursor:pointer;margin-right:auto;display:flex;gap:8px;align-items:center}
.logo{width:28px;height:28px;border-radius:6px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-size:15px}
.dnav{display:none;gap:2px}
.dnav button{background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--mute)}
.dnav button[aria-current="page"]{color:var(--brand);font-weight:700;background:var(--bg)}
.chip-btn,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:40px;cursor:pointer}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:10px;padding:12px 20px;min-height:48px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px}
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bnav button{flex:1;background:none;border:0;padding:10px 2px;min-height:56px;font-size:12.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bnav button[aria-current="page"]{color:var(--brand);font-weight:700}
nav.bnav span{font-size:20px;line-height:1}
@media(min-width:820px){.dnav{display:flex}nav.bnav{display:none}body{padding-bottom:24px}}
.view[hidden]{display:none}
/* hero */
.hero{display:grid;gap:28px;padding:32px 0 20px}
.hero h1{font-size:clamp(30px,6.2vw,50px);max-width:16em}
.hero p{color:var(--mute);max-width:34em;margin:14px 0 20px}
.row{display:flex;flex-wrap:wrap;gap:10px}
@media(min-width:820px){.hero{grid-template-columns:1.05fr 1fr;align-items:center;padding:56px 0 32px}}
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.lhead{padding:8px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:14px;display:flex;justify-content:space-between}
.paper{font-family:Kalam,Mukta,cursive;font-size:20px;line-height:32px;padding:6px 16px 6px 44px;background:linear-gradient(90deg,transparent 33px,var(--margin) 33px 35px,transparent 35px),repeating-linear-gradient(var(--paper) 0 31px,var(--rule) 31px 32px);transform:rotate(-.4deg)}
.paper div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parsed{padding:12px 14px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.35}
.pc b{display:block;font-size:17px}
.pc.in b{color:var(--green)}.pc.out b{color:var(--red)}
.pc.chk{border:1.5px dashed var(--amber)}
.pc.chk small{color:var(--amber);font-weight:600}
.pc small{color:var(--mute)}
.sec{padding:24px 0}
.sec h2{font-size:24px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:600px){.grid.f{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid.f{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:18px;margin-bottom:4px}.card p{margin:0;color:var(--mute);font-size:15.5px}
.cta{margin:20px 0 32px;background:var(--brand);color:var(--onbrand);border-radius:14px;padding:24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.cta .btn{background:var(--onbrand);color:var(--brand)}
footer{color:var(--mute);font-size:14px;padding:8px 0 24px}
/* dashboard */
.dh{padding:20px 0 8px}.dh h1{font-size:26px}.dh p{margin:4px 0 0;color:var(--mute);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:820px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--line)}
.stat.in{border-left-color:var(--green)}.stat.out{border-left-color:var(--red)}.stat.est{border-left-color:var(--amber)}
.stat .l{font-size:14.5px;color:var(--mute);line-height:1.3}
.stat .v{font-size:25px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .n{font-size:12.5px;color:var(--mute);line-height:1.3;margin-top:2px}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.qa .btn{flex:1 1 140px}
.panels{display:grid;gap:12px;margin-top:6px}
@media(min-width:820px){.panels{grid-template-columns:1fr 1fr}}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;color:var(--mute);font-size:15.5px}
.empty .btn{margin-top:10px}
.panel h3{font-size:18px;margin-bottom:10px}
.assume{font-size:13.5px;color:var(--mute);margin:16px 0}
.stub{padding:48px 0;text-align:center}.stub h1{font-size:26px;margin-bottom:10px}.stub p{color:var(--mute);max-width:30em;margin:0 auto 18px}
@media(prefers-reduced-motion:no-preference){.paper{transition:transform .3s}.ledger:hover .paper{transform:rotate(0)}}
</style>
</head>
<body>
<header><div class="wrap bar">
<button class="brand" data-go="home" aria-label="Home"><span class="logo" aria-hidden="true">₹</span><span>AI Hisab</span></button>
<nav class="dnav" id="dnav" aria-label="Main"></nav>
<label class="sr" style="position:absolute;left:-9999px" for="lang">Language</label>
<select id="lang"><option value="0">हिन्दी</option><option value="1">English</option><option value="2">Hinglish</option></select>
<button class="chip-btn" id="theme" aria-label="Theme">◐</button>
<button class="btn sm" data-go="login" data-i="login"></button>
</div></header>

<main class="wrap">
<section class="view" id="v-home">
<div class="hero">
<div>

<div class="parsed">
<div class="pc in"><small data-i="recv"></small><b>₹2,500</b>Ramesh</div>
<div class="pc out chk"><small data-i="chk"></small><b>₹1,200</b>Shyam</div>
<div class="pc"><small>Shirt</small><b>₹4,000</b>10 × ₹400</div>
<div class="pc in"><small data-i="cashin"></small><b>₹500</b>Cash</div>
</div>
</div>
</div>

<div class="sec"><h2 data-i="fh"></h2>
<div class="grid f">
<div class="card"><h3 data-i="f1t"></h3><p data-i="f1d"></p></div>
<div class="card"><h3 data-i="f2t"></h3><p data-i="f2d"></p></div>
<div class="card"><h3 data-i="f3t"></h3><p data-i="f3d"></p></div>
<div class="card"><h3 data-i="f4t"></h3><p data-i="f4d"></p></div>
</div></div>
<div class="cta"><h2 style="font-size:22px" data-i="ctat"></h2><button class="btn" data-go="signup" data-i="start"></button></div>
</section>

<section class="view" id="v-dash" hidden>
<div class="dh"><h1 data-i="n_dash"></h1><p data-i="dsub"></p></div>
<div class="qa">
<button class="btn" data-go="scan" data-i="a_scan"></button>
<button class="btn ghost" data-go="sale" data-i="a_sale"></button>
<button class="btn ghost" data-go="expense" data-i="a_exp"></button>
<button class="btn ghost" data-go="customer" data-i="a_cust"></button>
<button class="btn ghost" data-go="supplier" data-i="a_supp"></button>
<button class="btn ghost" data-go="payment" data-i="a_pay"></button>
<button class="btn ghost" data-go="export" data-i="a_xls"></button>
</div>
<div class="stats" id="stats"></div>
<div class="panels">
<div class="card panel"><h3 data-i="p1"></h3><div class="empty"><span data-i="e1"></span><br><button class="btn sm" data-go="sale" data-i="a_sale"></button></div></div>
<div class="card panel"><h3 data-i="p2"></h3><div class="empty" data-i="e2"></div></div>
<div class="card panel"><h3 data-i="p3"></h3><div class="empty" data-i="e3"></div></div>
<div class="card panel"><h3 data-i="p4"></h3><div class="empty" data-i="e4"></div></div>
</div>
<p class="assume" data-i="asm"></p>
</section>

<section class="view" id="v-stub" hidden>
<div class="stub"><h1 id="stubT"></h1><p data-i="stubd"></p><button class="btn" data-go="dash" data-i="seedash"></button></div>
</section>
<footer data-i="foot"></footer>
</main>
<nav class="bnav" id="bnav" aria-label="Main"></nav>

<script>

a_pay:["+ पेमेंट दर्ज करें","+ Record payment","+ Payment darj karein"],a_xls:["Excel डाउनलोड करें","Download Excel","Excel download karein"],

 var h=location.hash.slice(1)||"home",cur=h;
 $("#dnav").innerHTML=NAV.map(function(n){return '<button data-go="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+t(n[1])+'</button>'}).join("");

function render(){

 ["home","dash","stub"].forEach(function(v){$("#v-"+v).hidden=v!==view});
 if(view==="stub")$("#stubT").textContent=t(SK[h]||"n_"+h);
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
